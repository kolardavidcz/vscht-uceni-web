<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VŠCHT Učení</title>
    <link rel="icon" type="image/svg+xml" href="/src/favicon.svg" />
    <meta property="og:title" content="VŠCHT Učení" />
    <meta property="og:type" content="website" />
    <meta
      property="og:description"
      content="Výukový portál a studijní materiály pro studenty VŠCHT Praha."
    />
    <!-- Trimmed weights (no 300/900 Jakarta, no Outfit 300–500). Self-host later if wiki needs custom sizes. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Outfit:wght@600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <!-- MathJax global configuration for inline $ and display $$ -->
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']],
          processEscapes: true,
          processEnvironments: true
        },
        options: {
          ignoreHtmlClass: 'tex2jax_ignore',
          processHtmlClass: 'tex2jax_process'
        }
      };
    </script>
    <!-- Native Speculation Rules API for instant prefetching on hover / pointerdown -->
    <script type="speculationrules">
      {
        "prefetch": [
          {
            "where": {
              "and": [
                { "href_matches": "/*" },
                { "not": { "href_matches": "/api/*" } }
              ]
            },
            "eagerness": "moderate"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
