ých kyselin jsou jejich hlavním zdrojem uhlíku.`,correctEmojis:[`🔴`,`〰️`,`☁️`,`🏃`,`💧`]}]},{id:`delta`,name:`Třída Deltaproteobacteria`,type:`Třída`,correctEmojis:[],children:[{id:`bdellovibrio`,name:`Rod Bdellovibrio`,type:`Rod`,description:`Životní cyklus se skládá z fáze rychlého pohybu za účelem nalezení kořisti a následného proniknutí do periplazmy jiné bakterie, kde tvoří tzv. bdeloplast.`,correctEmojis:[`🔴`,`〰️`,`💨`,`🏃`,`🌱`,`💧`,`🦈`]}]},{id:`gamma-skupina1`,name:`Skupina I (Enterobacteriaceae, Vibrionaceae)`,type:`Skupina`,description:`Využívají Embden-Meyerhofovu glykolýzu a pentosový cyklus k degradaci cukrů.`,correctEmojis:[`🍬`,`🌗`],children:[{id:`enterobacteriaceae`,name:`Čeleď Enterobacteriaceae`,type:`Čeleď`,description:`Velmi významná skupina klinicky důležitých bakterií. Oxidáza negativní, běžně osídlují trávicí trakty živočichů.`,correctEmojis:[`🔴`,`🌭`,`🌗`,`🍬`,`🏃`,`🚫🏃`],children:[{id:`escherichia`,name:`Rod Escherichia`,type:`Rod`,description:`Klíčový indikátor fekálního znečištění vody. Určité kmeny (EHEC, ETEC, atd.) však produkují enterotoxiny vyvolávající těžké průjmy.`,correctEmojis:[`🔴`,`🌭`,`🌗`,`🍬`,`🏃`,`🧑`,`🤝`,`🦠`,`🤒`,`🤢`]},{id:`salmonella`,name:`Rod Salmonella`,type:`Rod`,description:`Způsobuje záněty žaludku a střev, případně závažnější břišní tyfus či septikémie. Běžná kontaminace potravin drůbežího a vaječného původu.`,correctEmojis:[`🔴`,`🌭`,`🌗`,`🍬`,`🏃`,`🐄`,`🧑`,`🦠`,`🤒`,`🤢`]},{id:`yersinia`,name:`Rod Yersinia`,type:`Rod`,description:`Historicky zodpovědná za masivní pandemie dýmějového moru vlivem produkce silných toxinů s využitím T3SS systému.`,correctEmojis:[`🔴`,`🌭`,`🌗`,`🍬`,`🏃`,`🚫🏃`,`🐄`,`🧑`,`🕷️`,`🦠`,`🤒`,`☠️`]}]},{id:`vibrionaceae`,name:`Čeleď Vibrionaceae`,type:`Čeleď`,description:`Polárně bičíkaté bakterie. Původce těžkých infekcí spojených s masivními ztrátami vody z těla přes specifický AB toxin.`,correctEmojis:[`🔴`,`🌭`,`🌗`,`💡`,`🍬`,`🏃`,`💧`,`🧑`,`🦠`,`🤒`,`🤢`,`☠️`]}]},{id:`gamma-skupina2`,name:`Skupina II (Pseudomonaceae, Azotobacteriaceae a o bioteroristické hrozby (původce sněti slezinné). Zástupci se také používají v zemědělství jako bioinsekticidy narušující trávicí ústrojí škůdců.`,correctEmojis:[`🔵`,`🌭`,`💨`,`🌗`,`🛡️`,`🏃`,`🌱`,`♻️`,`🦠`,`🤒`,`☠️`,`🐛`]},{id:`listeria`,name:`Rod Listeria`,type:`Rod`,description:`Nebezpečné kontaminanty chladírenských výrobků s tendencí pronikat skrze bariéry u těhotných a oslabených jedinců s afinitou k CNS novorozenců.`,correctEmojis:[`🔵`,`🌭`,`🌗`,`🍬`,`🥶`,`🏃`,`🐄`,`🧑`,`🦠`,`🤒`,`🤢`,`🧠`,`☠️`]},{id:`staphylococcus`,name:`Rod Staphylococcus`,type:`Rod`,description:`Významní producenti koaguláz a silných enterotoxinů způsobujících těžké otravy z potravin. Často kolonizují kůži a sliznice jako komenzálové, v ranných infekcích tvoří MRSA kmeny závažný zdravotnický problém.`,correctEmojis:[`🔵`,`⚪`,`🍇`,`🌗`,`🍬`,`🚫🏃`,`🧑`,`🤷`,`🦠`,`🤒`,`☠️`]},{id:`lactobacillus`,name:`Rod Lactobacillus`,type:`Rod`,description:`Klíčový ochranný prvek poševní sliznice vlivem snižování pH. Esenciální startovací kultury při zpracování kyselého zelí, sýrů, jogurtů či probiotik.`,correctEmojis:[`🔵`,`🌭`,`☁️`,`🚫💨`,`🍬`,`🚫🏃`,`🧑`,`🤝`,`🥛`]},{id:`leuconostoc`,name:`Rod Leuconostoc`,type:`Rod`,description:`Buňky sférické nebo ovoidní, uspořádány po dvou nebo v řetízcích. Fakultativně anaerobní, chemoorganotrofní. Hojné na rostlinách a v mléčných produktech.`,correctEmojis:[`🔵`,`⚪`,`⛓️`,`🌗`,`🍬`,`🚫🏃`,`🥛`]},{id:`streptococcus`,name:`Rod Streptococcus`,type:`Rod`,description:`Běžně děleni dle typu hemolýzy. Častí původci angín, zubního kazu, zánětů středouší nebo novorozeneckých infekcí vlivem širokého arsenálu extracelulárních toxinů.`,correctEmojis:[`🔵`,`⚪`,`⛓️`,`🌗`,`🍬`,`🚫🏃`,`🧑`,`🤷`,`🦠`,`🤒`,`🫁`,`☠️`]}]},{id:`clostridia-class`,name:`Třída Clostridia`,type:`Třída`,correctEmojis:[],children:[{id:`clostridium`,name:`Rod Clostridium`,type:`Rod`,description:`Zásadní producenti nejsilnějších popsaných biologických jedů narušujících nervosvalovou ploténku, nebo histotoxik vyvolávajících rychle se šířící plynaté gangrény.`,corr Vítejte na VŠCHT! Studium zde (a obzvláště bioinformatiky, která kombinuje chemii, biologii a informatiku) je maraton, nikoli sprint. Tato stránka obsahuje základní praktické tipy, jak si usnadnit život, nezbláznit se z kvanta učiva a efektivně organizovat svůj čas a studijní materiály.

## 🚀 Rychlý rozcestník (VŠCHT 101)

Abyste nemuseli složitě dohledávat základní odkazy, zde je rychlá startovací sada:

* **Informační systémy:** [SIS VŠCHT](https://sis.vscht.cz/) a [Moodle VŠCHT](https://e-learning.vscht.cz/)
* **Studijní literatura:** [VŠCHT nakladatelství](https://vydavatelstvi.vscht.cz/) (mnoho skript je dostupných zdarma v elektronické verzi pro studenty) nebo [starší e-learningový archiv skript](https://e-learning.vscht.cz/course/view.php?id=1076).
* **Wi-Fi připojení:** Pro snadné nastavení připojení k síti eduroam se připojte z budovy VŠCHT, popřípadě si stáhněte certifikát z [webu školy](https://vc.vscht.cz/navody/sit/wi-fi)
* **NTK Tisk:** Nejspolehlivější tisk v NTK je při stažení [speciálního insalačního programu](https://www.techlib.cz/cs/2912-jak-nainstalovat-ntk-tiskarny-na-vlastni-zarizeni) na Windows (a možná i macOS)
* **Oslovování vyučujících:** Nevíte, jak oslovit vyučujícího? Pomůže vám [Titulátor](https://titulator.smid.io/). Zapamatujte si základní pravidlo: *vždy oslovujeme nejvyšším dosaženým titulem*.

## 📝 Jak efektivně dělat zápisky z přednášek

### 1. Offline přednášky (v posluchárnách)
* **Zápisky rukou vs. na počítači:** Výzkumy ukazují, že zapisování si poznámek rukou (na papír nebo tablet se stylusem) je mnohem efektivnější pro zapamatování než psaní na klávesnici nebo podtrhávání prezentací. Nutí vás to totiž informace syntetizovat a přeformulovat, nikoli jen mechanicky přepisovat.
    * **Double-screen strategie:** Mějte prezentaci otevřenou na mobilu nebo tabletu vedle sešitu. Usnadní vám to doplňování poznámek k předchozím slajdům, pokud vyučující kliká příliš rychle.
    * **Tisk klíčových přehledů:** Pokud si píšete poznámky do tabletu, vytiskněte si nejdůležitější tabulky (např. periodickou tabulku, tabulku aminokyselin nebo přehled derivací) na papír. Je nesmírně otravné neustále překlikávat mezi poznámkami a tabulkou.

### 2. Online přednášky a záznamy
* **Přeskakování ticha:** Pokud sledujete nahrané přednášky, nainstalujte si rozšíření do prohlížeče, které automaticky přeskakuje tiché pasáže – například [Jump Cutter pro Chrome](https://chromewebstore.google.com/detail/jump-cutter/lmppdpldfpfdlipofacekcfleacbbncp) a Ušetří vám to až 20 % času. Navíc vám přidá možnost si v nastavit klávesové zkratky.

---

## 💻 Práce s kódem a psaní protokolů

Při dělání zápisků z programovacích předmětů se může hodit vkládat kód do zápisků, ale Word standardně neumí hezky formátovat kód. Proto vyzkoušejte:

1. **Doplněk:** [Easy Syntax Highlighter](https://appsource.microsoft.com/en-us/product/office/wa200000011?tab=overview). Umožňuje barvit kód přímo ve Wordu. Zkuste světlá témata *A11y Light* a tmavé *Tomorrow Night*.
2. **Automatické formátování maker:** Pokud kopírujete kód v písmu \`Courier New\` (velikost 11), následující VBA makro jej automaticky převede na moderní a čitelnější \`Consolas\` (velikost 9) a tabulkám nastaví profesionální tmavé pozadí \`#1E1E1E\`:

\`\`\`
Sub CodeFiX()
    Dim rng As Range
    Dim tbl As Table
    Dim found As Boolean
    
    '# --- Krok 1: Změna písma z "Courier New" (11pt) na "Consolas" (9pt) ---
    Set rng = ActiveDocument.Content
    rng.Find.ClearFormatting
    rng.Find.Replacement.ClearFormatting
    
    With rng.Find
        .Font.Name = "Courier New"
        .Font.Size = 11
        .Text = ""
        .Forward = True
        .Wrap = wdFindStop
        .Format = True
        .MatchCase = False
        .MatchWholeWord = False
    End With
    
    Do While rng.Find.Execute
        found = True
        rng.Font.Name = "Consolas"
        rng.Font.Size = 9
        rng.Collapse wdCollapseEnd
    Loop
    
    '# --- Krok 2: Nastavení barvy pozadí tabulek na #1E1E1E (tmavý režim) ---
    For Each tbl In ActiveDocument.Tables
        tbl.Shading.BackgroundPatternColor = RGB(30, 30, 30) ' #1E1E1E v RGB
    Next tbl
    
    '# --- Upozornění uživatele ---
    If found Then
        MsgBox "Formátování kódu a barev tabulek proběhlo úspěšně.", vbInformation, "Hotovo"
    Else
        MsgBox "Text v písmu 'Courier New' (11pt) nebyl nalezen, ale pozadí tabulek bylo upraveno.", vbExclamation, "Částečně hotovo"
    End If
End Sub

* **Kompilace s přísnými kontrolami**:

## 🎯 Vstup a výstup (Alespoň základ)
* Funkce \`printf()\` a \`scanf()\`.
* **Debugging**: Naučte se krokovat program (debugging). Umožňuje vám podívat se v každém kroku programu, jaké hodnoty jsou v proměnných a kudy kód běží. 
* *Tip:* Požádejte cvičícího nebo staršího studenta, aby vám krokování ukázal přímo ve vašem IDE (CLion/VS Code). Ušetří vám to desítky hodin tápání.

## 🔢 Desetinná čísla a přesnost (Float / Double)
Při porovnávání desetinných čísel nikdy nepoužívejte \`a == b\`, protože počítač reprezentuje desetinná čísla s omezenou přesností. Místo toho se používá malá tolerance (epsilon): \`fabs(a - b) < 1e-9\` (nebo konstanta \`DBL_EPSILON\`).

* Jak funguje epsilon a proč se používá:
  <iframe src="https://www.youtube.com/embed/bbkcEiUjehk?rel=0&wmode=transparent" class="w-full aspect-video rounded-xl my-4 border border-slate-200/85 shadow-sm" allowfullscreen></iframe>
* Vyzkoušejte si [interaktivní simulátor floatů a doublů](https://float.exposed/0x5cbf9401).

## ⚠️ Testování a hraniční stavy (Edge Cases)
Před spuštěním programu si nakreslete diagram nebo propočítejte na papíře, jak se vyhodnotí různé vstupy (např. nula, záporná čísla, extrémně velké hodnoty). Pomáhají **vývojové diagramy (Flowcharts)**:

## 🍎 Analogie: Ukazatele a pole (Jablka a šuplíky)

### 1. Předávání hodnotou (Kopie)
Máme 11 jablek. Pokud funkci předáme hodnotu \`pocetJablek\`, předáváme jí pouze **papírek s kopií** této hodnoty:
\`\`\`c
#include <stdio.h>

void mojeFunkce(int jablekVeFunkci);

int main() {
    int pocetJablek = 11;
    mojeFunkce(pocetJablek); // Předáváme kopii hodnoty (11)
    printf("Pocet jablek v main: %d\\n", pocetJablek); // Stále vypíše 11
    return 0;
}

void mojeFunkce(int jablekVeFunkci) {
     jablekVeFunkci = 9; // Měníme pouze kopii, originální proměnná se nezmění!
}
\`\`\`

### 2. Předávání odkazem (Ukazatele / Pointers)
Pokud chceme, aby funkce mohla originální hodnotu změnit, předáme jí **adresu schovky** (paměťového místa), kde jsou jablka uložena. K tomu slouží ukazatele (\`*\`) a získání adresy (\`&\`):
* \`int * variable\` – Datový typ, který neobsahuje číslo, ale **adresu na schovku**.
* \`*variable\` – Říká: "jdi na adresu schovky a pracuj s hodnotou uvnitř."
* \`&variable\` – Získá adresu schovky dané proměnné.

\`\`\`c
#include <stdio.h>

void mojeFunkce2(int * jablekVeFunkci);

int main() {
    int pocetJablek = 11;
    mojeFunkce2(&pocetJablek); // Předáváme adresu (ampersandem &)
    printf("Pocet jablek po zmene: %d\\n", pocetJablek); // Vypíše 9!
    return 0;
}

void mojeFunkce2(int * jablekVeFunkci) {
     *jablekVeFunkci = 9; // Na adrese schránky přepíšeme hodnotu na 9
}
\`\`\`

### 3. Jednorozměrná pole (Arrays)
Abychom nemuseli posílat adresy na 30 různých schránek, pronajmeme si v paměti řadu schránek vedle sebe. Předáme pak pouze **adresu 1. schránky** a **počet prvků** (délku pole):
\`\`\`c
#include <stdio.h>

void mojeFunkce3(int * odkazNaPrvniSchranku, int delka);

int main() {
    int cenyJablek[30]; // Rezervujeme si pole o velikosti 30
    for(int i = 0; i < 30; i++) {
        cenyJablek[i] = i + 10;
    }
    mojeFunkce3(cenyJablek, 30); // Jméno pole funguje jako ukazatel na 1. prvek
    return 0;
}

void mojeFunkce3(int * odkazNaPrvniSchranku, int delka) {
     // K prvkům přistupujeme pomocí indexů: odkazNaPrvniSchranku[i]
}
\`\`\`

### 4. Vícerozměrná pole
Chceme uložit ceny akcií (30 dní) pro 100 různých druhů ovoce:
* **Statické 2D pole**: Rezervuje se pevná tabulka v paměti:
\`\`\`c
void mojeFunkce4(int ovoce[100][30], int druhy, int dny);

int main() {
    int typyOvoce[100][30]; // 100 řádků (ovoce), 30 sloupců (dny)
    mojeFunkce4(typyOvoce, 100, 30);
    return 0;
}
\`\`\`

## 💾 Dynamická paměť (\`malloc\` & \`free\`)
Když dopředu neznáme velikost pole, musíme paměť alokovat dynamicky na haldě (heap) pomocí \`malloc()\` nebo \`calloc()\`.
> [!IMPORTANT]
> **Zlaté pravidlo**: Každý \`malloc\` musí mít svůj odpovídající \`free\`. Pokud paměť neuvolníte, vzniká **Memory Leak** (únik paměti), což na Progtestu znamená ztrátu bodů.

Pro detekci úniků paměti použijte:
* **Valgrind**: Spuštění programu s \`valgrind --leak-check=full ./main\`
* **Address Sanitizer** (integrovaný v kompilátoru):
  \`\`\`bash
  gcc -fsanitize=address -g main.c -o main
  \`\`\`

## ⚠️ Časté studentské chyby na Progtestu

### 1. Validace vstupu
Vždy kontrolujte návratovou hodnotu \`scanf\`. Pokud očekáváte číslo a uživatel zadá písmeno, \`scanf\` neuspěje a vrátí jinou hodnotu než počet úspěšně načtených proměnných.
\`\`\`c
int x;
if (scanf("%d", &x) != 1) {
    printf("Nespravny vstup.\\n");
    return 1;
}
\`\`\`

### 2. Zakázaná klíčová slova
Progtest v C zakazuje C++ klíčová slova. Nepoužívejte slova jako *new, delete, private, public, protected*.

### 3. Vynucení výpisu (\`fflush\`)
Standardní výstup (\`printf\`) se v některých vývojových prostředích (např. CLion na Windows) nevypisuje ihned, ale až na konci programu. Pro vynucení okamžitého výpisu použijte \`fflush(stdout)\`:
\`\`\`c
printf("Zadejte cislo: ");
fflush(stdout);
\`\`\`

### Automatické testování pomocí skriptu
Místo ručního kopírování vstupů si vytvořte skript \`testshell.sh\`, který automaticky porovná výstupy vašeho programu s referenčními soubory:

\`\`\`bash
#!/bin/bash

PROG=./main
REFERENCE_FOLDER=CZE/*_in.txt

## 📐 Typy důkazů a Matematická logika

Při studiu algoritmů budete muset dokazovat jejich správnost. Zde jsou základní techniky, jak k důkazům přistupovat:

* **Studijní text:** [Typy důkazů (FIT ČVUT)](https://courses.fit.cvut.cz/BI-DML/@master/textbook/sec_0402_typy_dukazu.html)

### ❓ Co je to Důkaz sporem?
Důkaz sporem je jedna z nejběžnějších technik v matematické logice.
* **Princip:** Chceme dokázat tvrzení A ⇒ B. Místo přímého postupu předpokládáme opak – tedy že platí předpoklad A, ale **neplatí** závěr B (vyjádřeno jako: A ∧ ¬B).
* **Cíl:** Postupným logickým odvozováním z tohoto předpokladu dojdeme k zjevnému logickému nesmyslu (sporu) – např. že číslo x je zároveň sudé i liché, nebo že 1 = 0.
* **Závěr:** Protože předpoklad opaku vedl ke sporu, původní tvrzení A ⇒ B musí platit.

---

## 🧠 DMA (Diskrétní matematika pro VŠCHT)

Zde jsou základní koncepty, které studentům na začátku často dělají potíže:

* **Studijní text:** [Diskrétní matematika a logika (FIT ČVUT)](https://courses.fit.cvut.cz/BI-DML/@master/textbook/sec_0204_taut_kontr_splnit.html)

### 1. Nutná a postačující podmínka
Mějme výroky E a F:

Pokud je implikace E ⇒ F pravdivá, pak E je postačující podmínka pro F, a F je nutná podmínka pro E.
Pokud je ekvivalence E ⇔ F pravdivá, pak E je nutná a postačující podmínka pro F.

#### Příklad s dělitelností:
Uvažujme výroky: D₂ (číslo je dělitelné 2), D₃ (dělitelné 3), D₆ (dělitelné 6).

Platí D₆ ⇒ D₂ a D₆ ⇒ D₃. Dělitelnost šesti je postačující podmínkou pro dělitelnost dvěma. Dělitelnost dvěma je nutnou podmínkou pro dělitelnost šesti (pokud číslo není sudé, šesti ho určitě nevydělíte).
Platí D₆ ⇔ (D₂ ∧ D₃). Dělitelnost dvěma a třemi současně je nutnou i postačující podmínkou pro dělitelnost šesti.

### 2. Kvantifikátory: Pro každé (∀) & Existuje (∃)
* **Pro každé (∀x):** "pro všechna x platí", "každé x splňuje".
* **Existuje (∃x):** "existuje x takové, že platí", "alespoň jedno x splňuje".
* **Negování kvantifikátorů:** Při negaci zaměníme ∀ za ∃ (a naopak) a znegujeme samotné tvrzení.
  * *Tvrzení:* Všichni v oranžovém saku lžou. (∀x: lže(x) = 1)
  * *Negace:* Existuje alespoň jeden v oranžovém saku, který nelže. (∃x: lže(x) = 0)

### 3. Logická implikace – Mnemotechnika
Výsledky operace implikace (A ⇒ B) lze popsat vztahem mezi zkoušejícím (Z) a studentem (S):
* **0** = neumí, **1** = umí.

## 🚀 PA2: Přechod z C do C++ (Klíčové rozdíly)

C++ staví na C, ale přináší moderní abstrakce, které vám ušetří práci s ruční správou paměti:

1. **Reference (\`&\`)**: Místo ukazatelů (\`int * x\`) můžete předávat hodnoty referencí (\`int & x\`). Kód je čistší, protože nemusíte psát hvězdičky a ampersandy při volání:
   \`\`\`cpp
   void zvetsi(int & hodnota) {
       hodnota++; // Měníme přímo originální proměnnou
   }
   \`\`\`
2. **Kontejnery (\`std::vector\`, \`std::string\`)**: Zapomeňte na \`char[]\` a ruční alokaci polí. \`std::vector\` se automaticky zvětšuje a sám uvolní paměť, jakmile proměnná zanikne:
   \`\`\`cpp
   #include <vector>
   #include <string>
   
   std::vector<int> cisla = {1, 2, 3};
   cisla.push_back(4); // Automaticky alokuje paměť pro čtvrtý prvek
   \`\`\`
3. **Objekty a třídy**: Seskupování dat a funkcí, které nad nimi pracují, do jednoho celku.

## 📊 AG1: Dva základní průchody grafem

| Algoritmus | Datová struktura | Princip | Využití |
| :--- | :--- | :--- | :--- |
| BFS (Prohledávání do šířky) | Fronta (FIFO) | Prochází graf po "vlnách" (nejdříve sousedé, pak sousedé sousedů). | Hledání nejkratší cesty v neohodnoceném grafu. |

## 📚 Doporučené studijní zdroje (Programování a C++)

Přechod na C++ a objektové programování (PA2) vyžaduje kvalitní dokumentaci a pravidelné zkoušení. Zde jsou ty nejlepší zdroje:

* 📖 **[LearnCpp.com](https://www.learncpp.com/)** – Světově nejlepší bezplatný tutoriál na C++. Pokrývá vše od základních datových typů až po pokročilou správu paměti, šablony a výjimky. Doporučuje ho většina vyučujících na FITu.
* 🌐 **[cppreference.com](https://en.cppreference.com/)** – Kompletní referenční příručka standardní knihovny C++. Klíčové místo pro rychlé vyhledání funkcí u kontejnerů jako \`std::vector\`, \`std::map\`, \`std::set\`, atd.
* 📚 **[FIT-Wiki BI-PA2](https://fit-wiki.cz/skola/predmety/pa2/start)** – Studentská wiki obsahující užitečné tipy na semestrální projekty, minulé testy a zkouškové otázky.

### 💡 Tipy, jak úspěšně projít PA2 (a přežít Progtest):
1. **Naučte se pracovat s Valgrindem:** C++ vyžaduje ruční správu paměti (pokud nepoužíváte chytré ukazatele). Progtest kontroluje úniky paměti. Vždy lokálně testujte spuštěním přes Valgrind:

# -*- coding: utf-8 -*-
"""
Bioinformatická analýza sekvence DNA/RNA
Autor: VSCHT Bioinf
"""

def analyze_sequence(seq):
    seq = seq.upper().strip()
    seq = "".join([c for c in seq if c in "ATCGU"])
    
    length = len(seq)
    if length == 0:
        print("Chyba: Prázdná sekvence!")
        return
        
    counts = {n: seq.count(n) for n in "ATCGU"}
    gc_content = ((counts['G'] + counts['C']) / length) * 100
    
    print("=" * 40)
    print(" VÝSLEDKY BIOINFORMATICKÉ ANALÝZY")
    print("=" * 40)
    print(f"Délka sekvence: {length} bp")
    print(f"Obsah GC:        {gc_content:.2f} %")
    print("-" * 40)
    print("Frekvence nukleotidu:")
    for n, count in counts.items():
        if count > 0 or n in "ATCG":
            pct = (count / length) * 100
            print(f"  {n}: {count:5d} ({pct:6.2f} %)")
            
    rna = seq.replace("T", "U")
    print("-" * 40)
    print(f"RNA transkript (prvních 60 bp):
  {rna[:60]}")
    
    codon_table = {
        'AUG': 'M', 'UUU': 'F', 'UUC': 'F', 'UUA': 'L', 'UUG': 'L', 'UCU': 'S', 'UCC': 'S', 'UCA': 'S', 'UCG': 'S',
        'UAU': 'Y', 'UAC': 'Y', 'UAA': '*', 'UAG': '*', 'UGU': 'C', 'UGC': 'C', 'UGA': '*', 'UGG': 'W', 'CUU': 'L',
        'CUC': 'L', 'CUA': 'L', 'CUG': 'L', 'CCU': 'P', 'CCC': 'P', 'CCA': 'P', 'CCG': 'P', 'CAU': 'H', 'CAC': 'H',
        'CAA': 'Q', 'CAG': 'Q', 'CGU': 'R', 'CGC': 'R', 'CGA': 'R', 'CGG': 'R', 'AUU': 'I', 'AUC': 'I', 'AUA': 'I',
        'ACU': 'T', 'ACC': 'T', 'ACA': 'T', 'ACG': 'T', 'AAU': 'N', 'AAC': 'N', 'AAA': 'K', 'AAG': 'K', 'AGU': 'S',
        'AGC': 'S', 'AGA': 'R', 'AGG': 'R', 'GUU': 'V', 'GUC': 'V', 'GUA': 'V', 'GUG': 'V', 'GCU': 'A', 'GCC': 'A',
        'GCA': 'A', 'GCG': 'A', 'GAU': 'D', 'GAC': 'D', 'GAA': 'E', 'GAG': 'E', 'GGU': 'G', 'GGC': 'G', 'GGA': 'G',
        'GGG': 'G'
    }
    
    protein = []
    for i in range(0, len(rna) - 2, 3):
        codon = rna[i:i+3]
        protein.append(codon_table.get(codon, "?"))
        
    print(f"Proteinový preklad (prvních 20 AA):
  {''.join(protein[:20])}")
    print("=" * 40)

if __name__ == "__main__":
    test_dna = "ATGCGATCGATCGATCGATCGATCGATCGATCGATCGATCGATC"
    analyze_sequence(test_dna)

        @keyframes float-demo {
          0%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
          50% { transform: translateY(-30px) scale(1.05) rotate(10deg); }
        }
        
        /* Rotating border animation */
        .rotating-border-card {
          position: relative;
          background: rgba(15, 23, 42, 0.7);
          border-radius: 1.5rem;
          overflow: hidden;
          z-index: 1;
        }
        .rotating-border-card::before {
          content: '';
          position: absolute;
          top: -50%;
          left: -50%;
          width: 200%;
          height: 200%;
          background: conic-gradient(
            from 0deg,
            transparent 20%,
            var(--dark-primary) 40%,
            var(--dark-secondary) 50%,
            var(--dark-primary) 60%,
            transparent 80%
          );
          animation: border-rotate 6s linear infinite;
          z-index: -2;
          opacity: 0;
          transition: opacity 0.3s;
        }
        .rotating-border-card:hover::before {
          opacity: 1;
        }
        .rotating-border-card::after {
          content: '';
          position: absolute;
          inset: 1px;
          background: rgba(15, 23, 42, 0.95);
          border-radius: calc(1.5rem - 1px);
          z-index: -1;
        }

        @keyframes border-rotate {
          100% { transform: rotate(360deg); }
        }

        /* Light Sweep reflection effect */
        .card-sweep {
          position: relative;
          overflow: hidden;
        }
        .card-sweep::before {
          content: '';
          position: absolute;
          top: 0;
          left: -150%;
          width: 100%;
          height: 100%;
          background: linear-gradient(
            90deg,
            transparent,
            rgba(255, 255, 255, 0.08),
            transparent
          );
          transform: skewX(-25deg);
          transition: 0.75s;
        }
        .card-sweep:hover::before {
          left: 150%;
        }

        /* 3D Card Flip styles */
        .flip-container {
          perspective: 1000px;
          width: 100%;
          min-height: 220px;
        }
        .flip-inner {
          position: relative;
          width: 100%;
          height: 100%;
          text-align: center;
          transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
          transform-style: preserve-3d;
        }
        .flip-active {
          transform: rotateY(180deg);
        }
        .flip-front, .flip-back {
          position: absolute;
          width: 100%;
          height: 100%;
          backface-visibility: hidden;
          -webkit-backface-visibility: hidden;
        }
        .flip-back {
          transform: rotateY(180deg);
        }
